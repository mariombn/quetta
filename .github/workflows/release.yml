name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Release, unsigned)
        run: |
          xcodebuild build \
            -project quetta.xcodeproj \
            -scheme quetta \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP=$(find ./DerivedData -name "quetta.app" -maxdepth 6 | head -1)
          if [ -z "$APP" ]; then echo "quetta.app not found"; exit 1; fi
          echo "Packaging: $APP"

          VERSION="${GITHUB_REF_NAME}"
          DMG="Quetta-${VERSION}.dmg"

          mkdir dmg_staging
          cp -R "$APP" dmg_staging/quetta.app
          ln -s /Applications dmg_staging/Applications

          hdiutil create \
            -volname "Quetta ${VERSION}" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "$DMG"

          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
